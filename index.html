<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Min fleksitid</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#64748b;--border:#dbe3ee;--blue:#2563eb;--green:#15803d;--red:#dc2626;--shadow:0 8px 25px rgba(15,23,42,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111c2f;--text:#e7edf7;--muted:#9aacbf;--border:#2b3b53;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:20px}.top,.actions,.summary,.history-top,.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.top{margin:8px 0 20px}.top h1{margin:0;font-size:1.8rem}.muted{color:var(--muted)}.clock{font:700 1.2rem ui-monospace,monospace}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.status{font-size:1.15rem;font-weight:750;margin-bottom:14px}.actions{justify-content:flex-start;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}label{display:block;font-size:.85rem;color:var(--muted)}input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font:inherit}button,.filebtn{border:0;border-radius:10px;padding:11px 15px;font:700 .95rem system-ui;cursor:pointer}.start{background:var(--green);color:white}.stop{background:var(--red);color:white}.save{background:var(--blue);color:white}.secondary,.filebtn{background:transparent;color:var(--text);border:1px solid var(--border)}button:focus,input:focus,.filebtn:focus-within{outline:3px solid #60a5fa;outline-offset:2px}.note{margin-top:13px}.savebar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:15px}.preview{font-weight:800}.msg{min-height:1.2em;margin:9px 0 0;color:var(--muted)}.summary{align-items:stretch}.metric{flex:1}.metric .big{font-size:1.8rem;font-weight:800;margin-top:3px}.positive{color:#16a34a}.negative{color:#e11d48}.history-top{margin-bottom:10px;flex-wrap:wrap}.history{display:grid;gap:8px}.row{border:1px solid var(--border);padding:12px;border-radius:11px}.row-main{min-width:0}.row-note{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}.row-right{display:flex;align-items:center;gap:10px;white-space:nowrap}.del{padding:7px 9px;background:transparent;border:1px solid var(--border);color:var(--text)}.filebtn input{display:none}.small{font-size:.82rem}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 20px}
@media(max-width:640px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}.summary{display:grid;grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.row{align-items:flex-start;flex-direction:column}.row-right{width:100%;justify-content:space-between}.top h1{font-size:1.5rem}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>Min fleksitid</h1><div class="muted small">Personlig tidslogg - lagres bare i denne nettleseren</div></div><div class="clock" id="clock"></div></header>
<section class="card">
  <div class="status" id="status">Ikke startet i dag</div>
  <div class="actions"><button class="start" id="start" type="button">Start arbeidsdag</button><button class="stop" id="stop" type="button">Avslutt arbeidsdag</button></div>
  <div class="grid">
    <label>Fra<input id="from" type="time"></label>
    <label>Til<input id="to" type="time"></label>
    <label>Pause (min)<input id="break" type="number" min="0" max="300" value="30"></label>
    <label>Dato<input id="date" type="date"></label>
  </div>
  <label class="note">Notat<input id="note" maxlength="160" placeholder="F.eks. hjemmekontor, kurs, kveldsmøte"></label>
  <div class="savebar"><button class="save" id="save" type="button">Lagre dagen</button><span class="preview" id="preview"></span></div>
  <p class="msg" id="msg" aria-live="polite"></p>
</section>
<section class="summary">
 <div class="card metric"><div class="muted small">Saldo totalt</div><div class="big" id="balance">+0:00</div></div>
 <div class="card metric"><div class="muted small">Registrert</div><div class="big" id="count">0 dager</div></div>
 <div class="card metric"><div class="muted small">Normaldag</div><div class="big">7:30</div></div>
</section>
<section class="card">
 <div class="history-top"><div><strong>Historikk</strong><div class="muted small">Ny lagring på samme dato erstatter eksisterende dag.</div></div><div class="actions"><button class="secondary" id="export" type="button">Eksporter JSON</button><label class="filebtn">Importer<input id="import" type="file" accept="application/json,.json"></label></div></div>
 <div class="history" id="history"></div>
</section>
<div class="footer">Prototype v1 - localStorage. Eksporter JSON jevnlig hvis historikken er viktig.</div>
</main>
<script>
(()=>{
'use strict';
const KEY='min-fleksitid-v1', DAY=450;
const $=id=>document.getElementById(id);
let rows=[];
try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');rows=Array.isArray(parsed)?parsed:[]}catch{rows=[]}
const pad=n=>String(n).padStart(2,'0');
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function timeNow(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function toMin(t){if(!/^\d{2}:\d{2}$/.test(t||''))return null;const [h,m]=t.split(':').map(Number);return h*60+m}
function duration(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+':'+pad(m%60)}
function signed(m){m=Math.round(m);const sign=m<0?'-':'+';m=Math.abs(m);return sign+Math.floor(m/60)+':'+pad(m%60)}
function calc(){const a=toMin($('from').value),b=toMin($('to').value);const br=Math.min(300,Math.max(0,Number($('break').value)||0));if(a===null||b===null||b<a)return null;return Math.max(0,b-a-br)}
function updatePreview(){const m=calc();$('preview').textContent=m===null?'':duration(m)+' arbeid / '+signed(m-DAY)+' flex'}
function persist(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function escText(v){return String(v??'')}
function render(){
 rows.sort((a,b)=>b.date.localeCompare(a.date));
 const bal=rows.reduce((s,r)=>s+(Number(r.minutes)||0)-DAY,0);
 $('balance').textContent=signed(bal);$('balance').className='big '+(bal<0?'negative':'positive');
 $('count').textContent=rows.length+' '+(rows.length===1?'dag':'dager');
 const h=$('history');h.replaceChildren();
 if(!rows.length){const p=document.createElement('p');p.className='muted small';p.textContent='Ingen registreringer ennå.';h.appendChild(p);return}
 rows.forEach(r=>{
   const row=document.createElement('div');row.className='row';
   const main=document.createElement('div');main.className='row-main';
   const title=document.createElement('strong');title.textContent=r.date;
   const detail=document.createElement('div');detail.className='row-note';detail.textContent=`${escText(r.from)}-${escText(r.to)} · pause ${Number(r.break)||0} min${r.note?' · '+escText(r.note):''}`;
   main.append(title,detail);
   const right=document.createElement('div');right.className='row-right';
   const sum=document.createElement('strong');sum.className=(r.minutes-DAY<0?'negative':'positive');sum.textContent=duration(r.minutes)+' / '+signed(r.minutes-DAY);
   const del=document.createElement('button');del.type='button';del.className='del';del.textContent='Slett';del.setAttribute('aria-label','Slett registrering '+r.date);del.onclick=()=>{if(confirm('Slette registreringen for '+r.date+'?')){rows=rows.filter(x=>x.date!==r.date);persist()}};
   right.append(sum,del);row.append(main,right);h.appendChild(row);
 });
}
function setTodayStatus(){const r=rows.find(x=>x.date===localDate());$('status').textContent=r?`I dag: ${r.from}-${r.to} er lagret`:'Ikke startet i dag'}
$('date').value=localDate();
$('start').onclick=()=>{$('date').value=localDate();$('from').value=timeNow();$('status').textContent='Startet '+$('from').value;updatePreview()};
$('stop').onclick=()=>{$('date').value=localDate();$('to').value=timeNow();$('status').textContent='Avsluttet '+$('to').value;updatePreview()};
['from','to','break'].forEach(id=>$(id).addEventListener('input',updatePreview));
$('save').onclick=()=>{
 const minutes=calc(),date=$('date').value;
 if(!date||!$('from').value||!$('to').value||minutes===null){$('msg').textContent='Kontroller dato, starttid og sluttid.';return}
 const rec={date,from:$('from').value,to:$('to').value,break:Math.min(300,Math.max(0,Number($('break').value)||0)),note:$('note').value.trim(),minutes};
 const i=rows.findIndex(x=>x.date===date);if(i>=0)rows[i]=rec;else rows.push(rec);persist();setTodayStatus();$('msg').textContent='Dagen er lagret lokalt.';
};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fleksitid-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x))throw new Error();const clean=x.filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&Number.isFinite(Number(r.minutes))).map(r=>({date:r.date,from:String(r.from||''),to:String(r.to||''),break:Math.min(300,Math.max(0,Number(r.break)||0)),note:String(r.note||'').slice(0,160),minutes:Number(r.minutes)}));rows=clean;persist();setTodayStatus();$('msg').textContent='Backup importert.'}catch{$('msg').textContent='Kunne ikke lese backupfilen.'}finally{e.target.value=''}};reader.readAsText(f)};
function tick(){$('clock').textContent=new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();setTodayStatus();updatePreview();
})();
</script>
</body>
</html>
