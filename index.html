<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="En enkel personlig fleksitidslogg med lokal lagring.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Min fleksitid</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#64748b;--border:#dbe3ee;--blue:#2563eb;--green:#15803d;--red:#dc2626;--shadow:0 8px 24px rgba(15,23,42,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111c2f;--text:#e7edf7;--muted:#9aacbf;--border:#2b3b53;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.top,.actions,.summary,.row,.historyTop{display:flex;gap:12px;align-items:center;justify-content:space-between}.top{margin-bottom:20px}.top h1{margin:0;font-size:1.7rem}.muted{color:var(--muted)}.small{font-size:.82rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}label{display:block;color:var(--muted);font-size:.86rem}input{width:100%;margin-top:5px;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font:inherit}button,.fileButton{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;text-align:center}.start{background:var(--green);color:#fff}.stop{background:var(--red);color:#fff}.save{background:var(--blue);color:#fff}.secondary,.del,.fileButton{background:transparent;color:var(--text);border:1px solid var(--border)}button:focus,input:focus,.fileButton:focus-within{outline:3px solid #60a5fa;outline-offset:2px}.note{margin-top:13px}.big{font-size:1.8rem;font-weight:800}.metric{flex:1}.positive{color:#16a34a}.negative{color:#e11d48}.history{display:grid;gap:8px}.row{border:1px solid var(--border);padding:12px;border-radius:11px}.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:15px}.msg{min-height:1.2em}.right{display:flex;align-items:center;gap:10px}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px}.fileButton input{display:none}.install{display:none;background:#7c3aed;color:#fff}.install.show{display:inline-block}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}.summary{display:grid;grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.row{align-items:flex-start;flex-direction:column}.right{width:100%;justify-content:space-between}.historyTop{align-items:flex-start;flex-direction:column}.historyTop .actions{width:100%;flex-wrap:wrap}.top h1{font-size:1.45rem}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>Min fleksitid</h1><div class="muted small">Personlig tidslogg · lagres lokalt på denne enheten</div></div><strong id="clock"></strong></header>
<button class="install" id="install" type="button">Installer app</button>
<section class="card"><strong id="status">Ikke startet i dag</strong><div class="actions" style="margin-top:14px;justify-content:flex-start;flex-wrap:wrap"><button class="start" id="start" type="button">Start arbeidsdag</button><button class="stop" id="stop" type="button">Avslutt arbeidsdag</button></div><div class="grid"><label>Fra<input id="from" type="time"></label><label>Til<input id="to" type="time"></label><label>Pause (min)<input id="break" type="number" min="0" max="300" value="30"></label><label>Dato<input id="date" type="date"></label></div><label class="note">Notat<input id="note" maxlength="160" placeholder="F.eks. hjemmekontor, kurs, kveldsmøte"></label><div class="savebar"><button class="save" id="save" type="button">Lagre dagen</button><strong id="preview"></strong></div><p class="muted msg" id="msg" aria-live="polite"></p></section>
<section class="summary"><div class="card metric"><div class="muted small">Saldo totalt</div><div class="big" id="balance">+0:00</div></div><div class="card metric"><div class="muted small">Registrert</div><div class="big" id="count">0 dager</div></div><div class="card metric"><div class="muted small">Normaldag</div><div class="big">7:30</div></div></section>
<section class="card"><div class="historyTop"><div><strong>Historikk</strong><div class="muted small">Ny lagring samme dato erstatter eksisterende registrering.</div></div><div class="actions"><button class="secondary" id="export" type="button">Eksporter JSON</button><label class="fileButton">Importer<input id="import" type="file" accept="application/json,.json"></label></div></div><div id="history" class="history" style="margin-top:12px"></div></section>
<div class="footer">PWA v1 · localStorage · fungerer offline etter første lasting</div>
</main>
<script>
(()=>{'use strict';
const KEY='min-fleksitid-v1',DAY=450,$=id=>document.getElementById(id);let rows=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');rows=Array.isArray(x)?x:[]}catch{rows=[]}
const pad=n=>String(n).padStart(2,'0');const today=()=>{const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)};const now=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};const mins=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};const dur=m=>Math.floor(Math.abs(m)/60)+':'+pad(Math.abs(m)%60);const signed=m=>(m<0?'-':'+')+dur(m);
function calc(){const a=mins($('from').value),b=mins($('to').value),p=Math.min(300,Math.max(0,+$('break').value||0));return a===null||b===null||b<a?null:Math.max(0,b-a-p)}
function preview(){const m=calc();$('preview').textContent=m===null?'':dur(m)+' arbeid / '+signed(m-DAY)+' flex'}
function persist(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function render(){rows.sort((a,b)=>b.date.localeCompare(a.date));const bal=rows.reduce((s,r)=>s+r.minutes-DAY,0);$('balance').textContent=signed(bal);$('balance').className='big '+(bal<0?'negative':'positive');$('count').textContent=rows.length+' '+(rows.length===1?'dag':'dager');const h=$('history');h.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='muted small';p.textContent='Ingen registreringer ennå.';h.append(p)}rows.forEach(r=>{const el=document.createElement('div');el.className='row';const l=document.createElement('div'),t=document.createElement('strong'),d=document.createElement('div');t.textContent=r.date;d.className='muted small';d.textContent=r.from+'–'+r.to+' · pause '+r.break+' min'+(r.note?' · '+r.note:'');l.append(t,d);const rr=document.createElement('div');rr.className='right';const s=document.createElement('strong');s.textContent=dur(r.minutes)+' / '+signed(r.minutes-DAY);s.className=r.minutes-DAY<0?'negative':'positive';const del=document.createElement('button');del.type='button';del.className='del';del.textContent='Slett';del.onclick=()=>{if(confirm('Slette '+r.date+'?')){rows=rows.filter(x=>x.date!==r.date);persist()}};rr.append(s,del);el.append(l,rr);h.append(el)})}
function status(){const r=rows.find(x=>x.date===today());$('status').textContent=r?'I dag: '+r.from+'–'+r.to+' er lagret':'Ikke startet i dag'}
$('date').value=today();$('start').onclick=()=>{$('date').value=today();$('from').value=now();$('status').textContent='Startet '+$('from').value;preview()};$('stop').onclick=()=>{$('date').value=today();$('to').value=now();$('status').textContent='Avsluttet '+$('to').value;preview()};['from','to','break'].forEach(x=>$(x).oninput=preview);
$('save').onclick=()=>{const m=calc(),date=$('date').value;if(!date||m===null){$('msg').textContent='Kontroller dato, starttid og sluttid.';return}const r={date,from:$('from').value,to:$('to').value,break:Math.min(300,Math.max(0,+$('break').value||0)),note:$('note').value.trim(),minutes:m},i=rows.findIndex(x=>x.date===date);i>=0?rows[i]=r:rows.push(r);persist();status();$('msg').textContent='Dagen er lagret lokalt.'};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='fleksitid-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x))throw new Error();rows=x.filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&Number.isFinite(Number(r.minutes))).map(r=>({date:r.date,from:String(r.from||''),to:String(r.to||''),break:Math.min(300,Math.max(0,Number(r.break)||0)),note:String(r.note||'').slice(0,160),minutes:Number(r.minutes)}));persist();status();$('msg').textContent='Backup importert.'}catch{$('msg').textContent='Kunne ikke lese backupfilen.'}finally{e.target.value=''}};reader.readAsText(f)};
function tick(){$('clock').textContent=new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();status();preview();
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').classList.add('show')});$('install').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').classList.remove('show')};window.addEventListener('appinstalled',()=>{$('install').classList.remove('show')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error))}
})();
</script>
</body>
</html>
